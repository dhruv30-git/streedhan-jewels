server {
    listen 80 default_server;
    server_name _;
    root /var/www/streedhan;
    index index.html;
    server_tokens off;

    location / { try_files $uri $uri/ =404; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
